<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration & Result Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Register</a></li>
      <li><a href="#">Results</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <div class="container">
    <h1>Student Registration & Result Portal</h1>

    <!-- Alert Box -->
    <div id="alertBox" class="alert hidden"></div>

    <!-- Registration Form -->
    <form id="studentForm">
      <div class="form-grid">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="roll">Roll Number:</label>
        <input type="text" id="roll" name="roll" required pattern="[0-9]{2}[A-Z]{2}[0-9]{3}">

        <label for="course">Course:</label>
        <select id="course" name="course" required>
          <option value="">Select Course</option>
          <option value="B.Sc Computer Science">B.Sc Computer Science</option>
          <option value="BCA">BCA</option>
          <option value="B.Tech AI&DS">B.Tech AI&DS</option>
        </select>

        <label for="marks1">Subject 1 Marks:</label>
        <input type="number" id="marks1" name="marks1" min="0" max="100" required>

        <label for="marks2">Subject 2 Marks:</label>
        <input type="number" id="marks2" name="marks2" min="0" max="100" required>

        <label for="marks3">Subject 3 Marks:</label>
        <input type="number" id="marks3" name="marks3" min="0" max="100" required>
      </div>

      <button type="submit">Submit</button>
    </form>

    <!-- Result Display -->
    <div id="result" class="card hidden">
      <h2>Student Details</h2>
      <p id="studentDetails"></p>
      <h3>Marks</h3>
      <table>
        <tr><th>Subject</th><th>Marks</th></tr>
        <tr><td>Subject 1</td><td id="m1"></td></tr>
        <tr><td>Subject 2</td><td id="m2"></td></tr>
        <tr><td>Subject 3</td><td id="m3"></td></tr>
      </table>
      <p id="total"></p>
    </div>
  </div>

  <script>
    const form = document.getElementById('studentForm');
    const resultCard = document.getElementById('result');
    const alertBox = document.getElementById('alertBox');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      // Simple validation alert
      if (!form.checkValidity()) {
        alertBox.innerText = "⚠️ Please fill all fields correctly!";
        alertBox.classList.remove('hidden');
        alertBox.classList.add('error');
        return;
      }

      alertBox.classList.add('hidden');

      const name = document.getElementById('name').value;
      const roll = document.getElementById('roll').value;
      const course = document.getElementById('course').value;
      const m1 = parseInt(document.getElementById('marks1').value);
      const m2 = parseInt(document.getElementById('marks2').value);
      const m3 = parseInt(document.getElementById('marks3').value);

      document.getElementById('studentDetails').innerText = 
        `Name: ${name} | Roll: ${roll} | Course: ${course}`;
      document.getElementById('m1').innerText = m1;
      document.getElementById('m2').innerText = m2;
      document.getElementById('m3').innerText = m3;
      document.getElementById('total').innerText = `Total Marks: ${m1 + m2 + m3}`;

      resultCard.classList.remove('hidden');
    });
  </script>
</body>
</html>
